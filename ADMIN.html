<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPEC HUB - ระบบจัดการข้อมูล Admin</title>
    
    <!-- 🛡️ Security Check: บล็อกทันทีถ้าไม่ใช่ admin1234 (ทำงานก่อน Render หน้าเว็บ) -->
    <script>
        (function enforceAdminOnly() {
            const currentUser = localStorage.getItem('spechub_user');
            if (!currentUser || currentUser !== 'admin1234') {
                alert('⛔ คุณไม่มีสิทธิ์เข้าถึงหน้านี้! (เฉพาะ admin1234 เท่านั้น)');
                window.location.replace('HOME.html');
            }
        })();
    </script>

    <link rel="stylesheet" href="theme-style.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #d8d8d8;
            color: #111;
        }

        .page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            background: linear-gradient(180deg, #e5e5e5 0%, #c7c7c7 100%);
        }

        /* ================= Header Navbar ================= */
        header {
            width: 100%;
            max-width: 1200px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 24px;
            background: rgba(255,255,255,0.85);
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.12);
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .brand {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(90deg, #2563eb 0%, #1e40af 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-decoration: none;
        }

        nav {
            display: flex !important;
            gap: 15px;
            align-items: center;
        }

        nav a {
            text-decoration: none;
            color: #222;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }

        nav a:hover {
            color: #2563eb;
        }

        /* 🛠️ สีปุ่ม ADMIN เมื่อเปิดอยู่ในหน้าปัจจุบัน */
        nav a.active, .admin-btn-nav.active {
            color: #2563eb !important;
            -webkit-text-fill-color: #2563eb !important;
            font-weight: 800 !important;
            background: none !important;
        }

        .admin-btn-nav {
            text-decoration: none !important;
            display: inline-block !important;
            visibility: visible !important;
            opacity: 1 !important;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-actions a {
            color: #fff;
            background: linear-gradient(90deg, #2563eb 0%, #1e40af 100%);
            padding: 10px 14px;
            border-radius: 999px;
            text-decoration: none;
            font-weight: 700;
        }

        .header-actions a:hover {
            opacity: 0.95;
        }

        .theme-toggle-btn {
            background: #2563eb;
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            cursor: pointer;
        }

        /* ================= Admin Content Section ================= */
        .container {
            width: 100%;
            max-width: 1200px;
        }

        .card {
            background: #ffffff;
            border-radius: 24px;
            padding: 32px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.14);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 2px solid rgba(226, 232, 240, 0.3);
        }

        .card-title {
            font-size: 1.6rem;
            font-weight: 800;
            color: #2563eb !important;
            -webkit-text-fill-color: #2563eb !important;
            display: inline-block;
        }

        .btn-refresh {
            background: linear-gradient(90deg, #2563eb 0%, #1e40af 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 999px;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-refresh:hover { opacity: 0.9; }

        .status-msg {
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 0.95rem;
            font-weight: 600;
        }

        .status-success { background-color: #dcfce7; color: #15803d; }
        .status-error { background-color: #fee2e2; color: #b91c1c; }

        /* ================= สไตล์ตาราง ================= */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            background: #ffffff;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #e2e8f0;
        }

        th, td {
            padding: 14px 16px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
            color: #334155 !important;
            font-size: 0.95rem;
        }

        th {
            background-color: #f8fafc;
            color: #0f172a !important;
            font-weight: 700;
        }

        td b {
            color: #0f172a !important;
        }

        .pass-badge {
            background-color: #fce7f3;
            color: #be185d !important;
            padding: 6px 10px;
            border-radius: 6px;
            font-family: monospace;
            font-weight: 600;
        }

        .btn-action {
            padding: 6px 12px;
            border-radius: 6px;
            border: none;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            margin-right: 4px;
        }

        .btn-edit { background-color: #eab308; color: #fff !important; }
        .btn-delete { background-color: #ef4444; color: #fff !important; }

        /* 🛠️ สไตล์สำหรับโหมดมืด (Dark Mode Support) */
        body.dark-mode nav a.active, 
        body.dark-mode .admin-btn-nav.active {
            color: #60a5fa !important;
            -webkit-text-fill-color: #60a5fa !important;
        }

        body.dark-mode .card {
            background: #1e293b !important;
        }

        body.dark-mode .card-title {
            color: #60a5fa !important;
            -webkit-text-fill-color: #60a5fa !important;
        }

        body.dark-mode table {
            background: #0f172a !important;
            border-color: #334155 !important;
        }

        body.dark-mode th {
            background-color: #1e293b !important;
            color: #f8fafc !important;
        }

        body.dark-mode td {
            color: #cbd5e1 !important;
            border-color: #334155 !important;
        }

        body.dark-mode td b {
            color: #f8fafc !important;
        }
    </style>
</head>
<body>
    <div class="page">
        <!-- 📌 Header แถบด้านบน -->
        <header>
            <a href="HOME.html" class="brand">SPEC HUB</a>
            <nav>
                <a href="HOME.html">HOME</a>
                <a href="CPU.html">CPU</a>
                <a href="GPU.html">GPU</a>
                <a href="CASE.html">CASE</a>
                <a href="MAIN BORD.html">MAIN BORD</a>
                <a href="COMPARE.html">COMPARE</a>
                <a href="ADMIN.html" class="admin-btn-nav active">⚙️ ADMIN</a>
            </nav>
            <div class="header-actions">
                <button id="themeToggleBtn" class="theme-toggle-btn" type="button">🌙 Dark</button>
                <a href="login.html" id="auth-action">Login</a>
            </div>
        </header>

        <!-- 📌 ส่วนจัดการ Admin -->
        <div class="container">
            <div class="card">
                <div class="card-header">
                    <h1 class="card-title">SPEC HUB - จัดการบัญชีผู้ใช้ใน Neon Console</h1>
                    <button class="btn-refresh" onclick="loadUsers()">🔄 รีเฟรชข้อมูล</button>
                </div>

                <div id="statusBox" class="status-msg" style="display: none;"></div>

                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Username</th>
                            <th>Email</th>
                            <th>Password (รหัสผ่าน)</th>
                            <th>วันที่สร้าง</th>
                            <th>จัดการข้อมูล</th>
                        </tr>
                    </thead>
                    <tbody id="userTableBody">
                        <tr>
                            <td colspan="6" style="text-align: center; padding: 20px;">กำลังดึงข้อมูลผู้ใช้...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- 📌 Script จัดการ UI Header & Logout -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const auth = document.getElementById('auth-action');
            const currentUser = localStorage.getItem('spechub_user');
            
            if (auth && currentUser === 'admin1234') {
                auth.textContent = currentUser;
                auth.href = '#';
                auth.onclick = function(e) {
                    e.preventDefault();
                    if (confirm('ต้องการออกจากระบบใช่หรือไม่?')) {
                        localStorage.removeItem('spechub_user');
                        window.location.href = 'HOME.html';
                    }
                };
            }
        });
    </script>

    <!-- 📌 Script ดึงและจัดการข้อมูลผู้ใช้ -->
    <script>
        const API_BASE_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
            ? 'http://localhost:5000'
            : 'https://spec-hub.onrender.com';

        async function loadUsers() {
            const statusBox = document.getElementById('statusBox');
            const tableBody = document.getElementById('userTableBody');

            statusBox.style.display = 'none';
            tableBody.innerHTML = '<tr><td colspan="6" style="text-align: center; padding: 20px;">กำลังดึงข้อมูล...</td></tr>';

            try {
                const res = await fetch(`${API_BASE_URL}/api/users?t=${Date.now()}`);
                if (!res.ok) throw new Error(`HTTP Error Status: ${res.status}`);

                const users = await res.json();

                statusBox.className = 'status-msg status-success';
                statusBox.innerHTML = `✅ เชื่อมต่อ Neon ผ่าน Server สำเร็จ! โหลดล่าสุดเมื่อ: ${new Date().toLocaleTimeString()} (ทั้งหมด ${users.length} รายการ)`;
                statusBox.style.display = 'block';

                if (users.length === 0) {
                    tableBody.innerHTML = '<tr><td colspan="6" style="text-align: center;">ไม่พบข้อมูลผู้ใช้ในระบบ</td></tr>';
                    return;
                }

                tableBody.innerHTML = users.map(user => `
                    <tr>
                        <td>${user.id}</td>
                        <td><b>${user.username}</b></td>
                        <td>${user.email}</td>
                        <td><span class="pass-badge">${user.password}</span></td>
                        <td>${user.created_at ? new Date(user.created_at).toLocaleString('th-TH') : '-'}</td>
                        <td>
                            <button class="btn-action btn-edit" onclick="editPassword(${user.id}, '${user.username}')">✏️ แก้ไขรหัสผ่าน</button>
                            <button class="btn-action btn-delete" onclick="deleteUser(${user.id}, '${user.username}')">🗑️ ลบ</button>
                        </td>
                    </tr>
                `).join('');

            } catch (err) {
                console.error('Error:', err);
                statusBox.className = 'status-msg status-error';
                statusBox.innerHTML = `❌ ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ (${API_BASE_URL}) ได้`;
                statusBox.style.display = 'block';

                tableBody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: #ef4444;">เกิดข้อผิดพลาดในการโหลดข้อมูล</td></tr>';
            }
        }

        async function editPassword(id, username) {
            const newPassword = prompt(`กรอกรหัสผ่านใหม่สำหรับผู้ใช้ "${username}":`);
            if (!newPassword || newPassword.trim() === '') return;

            try {
                const res = await fetch(`${API_BASE_URL}/api/users/${id}/password`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ newPassword })
                });
                const data = await res.json();
                alert(data.message || 'อัปเดตรหัสผ่านสำเร็จ');
                loadUsers();
            } catch (err) {
                alert('เกิดข้อผิดพลาดในการแก้ไขรหัสผ่าน');
            }
        }

        async function deleteUser(id, username) {
            if (!confirm(`คุณแน่ใจหรือไม่ว่าต้องการลบบัญชี "${username}"?`)) return;

            try {
                const res = await fetch(`${API_BASE_URL}/api/users/${id}`, { method: 'DELETE' });
                const data = await res.json();
                alert(data.message || 'ลบบัญชีสำเร็จ');
                loadUsers();
            } catch (err) {
                alert('เกิดข้อผิดพลาดในการลบบัญชี');
            }
        }

        window.onload = loadUsers;
    </script>

    <script src="theme-toggle.js"></script>
</body>
</html>
