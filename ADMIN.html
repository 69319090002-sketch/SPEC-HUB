<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPEC HUB - ระบบจัดการหลังบ้าน (Neon Console Integration)</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #e9ecef;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        h1 {
            margin: 0;
            color: #1a252f;
            font-size: 24px;
        }
        .btn-refresh {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        .btn-refresh:hover {
            background-color: #0056b3;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #dee2e6;
        }
        th {
            background-color: #f8f9fa;
            color: #495057;
            font-weight: 600;
        }
        tr:hover {
            background-color: #f1f3f5;
        }
        .password-code {
            background-color: #f8d7da;
            color: #721c24;
            padding: 4px 8px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 14px;
        }
        .btn-action {
            padding: 6px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            margin-right: 5px;
            transition: 0.2s;
        }
        .btn-edit {
            background-color: #ffc107;
            color: #212529;
        }
        .btn-edit:hover {
            background-color: #e0a800;
        }
        .btn-delete {
            background-color: #dc3545;
            color: white;
        }
        .btn-delete:hover {
            background-color: #c82333;
        }
        .status-msg {
            margin-top: 10px;
            font-size: 14px;
            color: #6c757d;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>SPEC HUB - จัดการบัญชีผู้ใช้ใน Neon Console</h1>
        <button class="btn-refresh" onclick="loadUsersFromNeon()">🔄 รีเฟรชข้อมูล</button>
    </div>

    <div class="status-msg" id="statusMsg">กำลังเชื่อมต่อกับ Server...</div>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Username</th>
                <th>Email</th>
                <th>Password (รหัสผ่าน)</th>
                <th>วันที่สร้าง</th>
                <th>จัดการข้อมูล</th>
            </tr>
        </thead>
        <tbody id="usersTableBody">
            <!-- รายชื่อจาก Neon จะปรากฏที่นี่ -->
        </tbody>
    </table>
</div>

<script>
    // 📌 ใส่ URL Backend ของ Render เรียบร้อยแล้ว
    const RENDER_BACKEND_URL = 'https://spec-hub.onrender.com';

    // ตรวจสอบอัตโนมัติ: เปิดในคอมใช้ localhost / เปิดบน Netlify ใช้ Render URL
    const API_BASE = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
        ? 'http://localhost:5000' 
        : RENDER_BACKEND_URL;

    // 1. ดึงข้อมูลผู้ใช้จาก Neon Cloud ผ่าน Node.js API บน Render
    async function loadUsersFromNeon() {
        const statusMsg = document.getElementById('statusMsg');
        const tbody = document.getElementById('usersTableBody');
        statusMsg.style.color = '#6c757d';
        statusMsg.innerText = `กำลังเชื่อมต่อกับ Backend (${API_BASE})...`;

        try {
            const response = await fetch(`${API_BASE}/api/users?t=${Date.now()}`);
            if (!response.ok) throw new Error('ไม่สามารถดึงข้อมูลได้');

            const users = await response.json();
            tbody.innerHTML = '';

            if (users.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">ไม่พบข้อมูลผู้ใช้ในฐานข้อมูล</td></tr>';
                statusMsg.innerText = 'เชื่อมต่อสำเร็จ (ไม่พบบัญชีผู้ใช้)';
                return;
            }

            users.forEach(user => {
                const tr = document.createElement('tr');
                const createdDate = user.created_at ? new Date(user.created_at).toLocaleString('th-TH') : '-';
                
                tr.innerHTML = `
                    <td>${user.id}</td>
                    <td><strong>${user.username}</strong></td>
                    <td>${user.email}</td>
                    <td><span class="password-code">${user.password}</span></td>
                    <td>${createdDate}</td>
                    <td>
                        <button class="btn-action btn-edit" onclick="editUserPassword(${user.id}, '${user.username}')">✏️ แก้ไขรหัสผ่าน</button>
                        <button class="btn-action btn-delete" onclick="deleteUserAccount(${user.id}, '${user.username}')">🗑️ ลบ</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            statusMsg.style.color = '#28a745';
            statusMsg.innerText = `✅ เชื่อมต่อ Neon ผ่าน Render สำเร็จ! โหลดล่าสุดเมื่อ: ${new Date().toLocaleTimeString('th-TH')} (ทั้งหมด ${users.length} รายการ)`;
        } catch (err) {
            console.error('Error:', err);
            statusMsg.style.color = '#dc3545';
            statusMsg.innerText = '❌ เกิดข้อผิดพลาดในการเชื่อมต่อกับ Server/Neon';
            tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:red; font-weight:bold;">ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ (${API_BASE}) ได้ (หากเพิ่งรัน Render โปรดรอ 30-60 วินาทีเพื่อให้ Server ตื่น)</td></tr>`;
        }
    }

    // 2. แก้ไขรหัสผ่านผู้ใช้
    async function editUserPassword(userId, username) {
        const newPassword = prompt(`ระบุรหัสผ่านใหม่สำหรับผู้ใช้ "${username}":`);
        if (!newPassword || newPassword.trim() === '') return;

        try {
            const response = await fetch(`${API_BASE}/api/users/${userId}/password`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ newPassword: newPassword.trim() })
            });

            const result = await response.json();
            if (response.ok) {
                alert(result.message);
                loadUsersFromNeon();
            } else {
                alert(result.error || 'ไม่สามารถแก้ไขรหัสผ่านได้');
            }
        } catch (err) {
            alert('❌ เกิดข้อผิดพลาด ไม่สามารถเชื่อมต่อกับ Backend ได้');
        }
    }

    // 3. ลบบัญชีผู้ใช้
    async function deleteUserAccount(userId, username) {
        if (!confirm(`คุณแน่ใจหรือไม่ว่าต้องการลบบัญชี "${username}" ออกจากฐานข้อมูล Neon?`)) return;

        try {
            const response = await fetch(`${API_BASE}/api/users/${userId}`, {
                method: 'DELETE'
            });

            const result = await response.json();
            if (response.ok) {
                alert(result.message);
                loadUsersFromNeon();
            } else {
                alert(result.error || 'ไม่สามารถลบบัญชีได้');
            }
        } catch (err) {
            alert('❌ เกิดข้อผิดพลาด ไม่สามารถเชื่อมต่อกับ Backend ได้');
        }
    }

    // โหลดข้อมูลเมื่อเปิดหน้าเว็บ
    document.addEventListener('DOMContentLoaded', loadUsersFromNeon);
</script>

</body>
</html>
