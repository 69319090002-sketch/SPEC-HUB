<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPEC HUB - Signup</title>
    <link rel="icon" type="image/png" href="assets/LOGO%20SPECHUB.png">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --bg-image: url('assets/BK LOGUN.jpg');
            --glass-bg: rgba(15, 23, 42, 0.55);
            --glass-border: rgba(255, 255, 255, 0.16);
            --text-color: #e2e8f0;
            --input-bg: rgba(0, 0, 0, 0.3);
            --input-text: #ffffff;
            --input-placeholder: rgba(255, 255, 255, 0.5);
            --btn-bg: #3b82f6;
            --btn-text: #ffffff;
            --btn-hover-bg: #2563eb;
            --link-color: #60a5fa;
            --error-bg: rgba(239, 68, 68, 0.2);
            --error-border: rgba(239, 68, 68, 0.4);
            --error-text: #fca5a5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Kanit', 'Inter', sans-serif;
        }

        body {
            background-image: var(--bg-image);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: var(--text-color);
            position: relative;
            padding: 20px;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.45);
            z-index: 1;
        }

        .box {
            position: relative;
            background: var(--glass-bg);
            padding: 40px;
            border-radius: 24px;
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 420px;
            z-index: 2;
            text-align: center;
        }

        h2 {
            margin-bottom: 24px;
            font-weight: 700;
            font-size: 2rem;
            letter-spacing: -0.5px;
            color: #ffffff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        .input-group {
            position: relative;
            margin-bottom: 16px;
            text-align: left;
        }

        .input-group i.icon-prefix {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--input-placeholder);
            font-size: 1rem;
            pointer-events: none;
            transition: color 0.2s ease;
            z-index: 3;
        }

        .input-group input {
            width: 100%;
            padding: 14px 44px 14px 44px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            font-size: 0.95rem;
            color: var(--input-text);
            background: var(--input-bg);
            transition: all 0.2s ease;
        }

        .input-group input::placeholder {
            color: var(--input-placeholder);
        }

        .input-group input:focus {
            outline: none;
            background: rgba(0, 0, 0, 0.45);
            border-color: rgba(96, 165, 250, 0.8);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
        }

        .input-group input:focus ~ i.icon-prefix {
            color: #60a5fa;
        }

        /* Chrome Autofill fix */
        .input-group input:-webkit-autofill,
        .input-group input:-webkit-autofill:hover, 
        .input-group input:-webkit-autofill:focus, 
        .input-group input:-webkit-autofill:active {
            -webkit-box-shadow: 0 0 0 1000px rgba(15, 23, 42, 0.9) inset !important;
            -webkit-text-fill-color: #ffffff !important;
            border: 1px solid rgba(255, 255, 255, 0.2) !important;
            caret-color: #ffffff;
            transition: background-color 5000s ease-in-out 0s;
        }

        .toggle-password {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--input-placeholder);
            cursor: pointer;
            z-index: 4;
            padding: 4px;
            transition: color 0.2s ease;
        }

        .toggle-password:hover {
            color: #ffffff;
        }

        button[type="submit"] {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            background: var(--btn-bg);
            color: var(--btn-text);
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 8px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
        }

        button[type="submit"]:hover:not(:disabled) {
            background: var(--btn-hover-bg);
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4);
        }

        button[type="submit"]:disabled {
            opacity: 0.65;
            cursor: not-allowed;
            transform: none;
        }

        /* จัดระนาบไอคอนหมุนกับข้อความให้อยู่ตรงกลาง */
        #btnText {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            line-height: 1;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2.5px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #ffffff;
            animation: spin 0.8s linear infinite;
            flex-shrink: 0;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .note {
            margin-top: 14px;
            font-size: 0.9rem;
            color: #cbd5e1;
        }

        .note a {
            color: var(--link-color);
            text-decoration: none;
            font-weight: 600;
        }

        .note a:hover {
            text-decoration: underline;
        }

        .error {
            margin-bottom: 16px;
            color: var(--error-text);
            font-size: 0.88rem;
            background: var(--error-bg);
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid var(--error-border);
            display: none;
            line-height: 1.4;
            text-align: left;
        }

        @media (max-width: 480px) {
            .box {
                padding: 30px 20px;
            }
            h2 {
                font-size: 1.75rem;
            }
        }
    </style>
</head>
<body>

    <div class="box">
        <h2>สมัครสมาชิก</h2>
        
        <div class="error" id="signupError" role="alert"></div>

        <form id="signupForm" novalidate>
            <!-- Username -->
            <div class="input-group">
                <input id="newUsername" name="newUsername" placeholder="Username (เช่น user123)" autocomplete="username" required>
                <i class="fas fa-user icon-prefix"></i>
            </div>

            <!-- Email -->
            <div class="input-group">
                <input id="newEmail" name="newEmail" type="email" placeholder="Email (example@mail.com)" autocomplete="email" required>
                <i class="fas fa-envelope icon-prefix"></i>
            </div>

            <!-- Password -->
            <div class="input-group">
                <input id="newPassword" name="newPassword" type="password" placeholder="Password (อย่างน้อย 6 ตัวอักษร)" autocomplete="new-password" required>
                <i class="fas fa-lock icon-prefix"></i>
                <i class="fas fa-eye-slash toggle-password" id="togglePassword" title="ดูรหัสผ่าน"></i>
            </div>

            <!-- Confirm Password -->
            <div class="input-group">
                <input id="confirmPassword" name="confirmPassword" type="password" placeholder="Confirm Password" autocomplete="new-password" required>
                <i class="fas fa-lock icon-prefix"></i>
                <i class="fas fa-eye-slash toggle-password" id="toggleConfirmPassword" title="ดูรหัสผ่าน"></i>
            </div>

            <button type="submit" id="submitBtn">
                <span id="btnText">สมัครสมาชิก</span>
            </button>
        </form>

        <div class="note">มีบัญชีแล้ว? <a href="Login.html">เข้าสู่ระบบ</a></div>
    </div>

    <script>
        // Toggle Show/Hide Password
        function setupTogglePassword(toggleId, inputId) {
            const toggleBtn = document.getElementById(toggleId);
            const inputField = document.getElementById(inputId);

            if (toggleBtn && inputField) {
                toggleBtn.addEventListener('click', () => {
                    const isPassword = inputField.type === 'password';
                    inputField.type = isPassword ? 'text' : 'password';
                    toggleBtn.classList.toggle('fa-eye', isPassword);
                    toggleBtn.classList.toggle('fa-eye-slash', !isPassword);
                });
            }
        }

        setupTogglePassword('togglePassword', 'newPassword');
        setupTogglePassword('toggleConfirmPassword', 'confirmPassword');

        const SIGNUP_DRAFT_KEY = 'spechub_signup_draft';
        const usernameInput = document.getElementById('newUsername');
        const emailInput = document.getElementById('newEmail');
        const passwordInput = document.getElementById('newPassword');
        const confirmPasswordInput = document.getElementById('confirmPassword');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');

        // Blacklist Filter
        const BAD_WORDS = [
            'ควาย', 'ไอ้ควาย', 'ไอควาย', 'อีควาย', 'ควายง่าว', 'ควายเอ๊ย',
            'ควย', 'เหี้ย', 'ส้นตีน', 'เย็ด', 'เชี่ย', 'มึง', 'กู', 'แม่ง', 'สัส', 'สาส', 'สัด', 
            'ไอ้สัตว์', 'ไอ้สัส', 'อีดอก', 'อีเวร', 'ระยำ', 'ชาติหมา', 'เงี่ยน', 'กระหรี่', 'กะหรี่', 
            'โสเภณี', 'หี', 'จิ๋ม', 'แตด', 'ตูด', 'ดอ', 'เย็ดแม่', 'เย็ดแม่ง', 'โคตรพ่อ', 'โคตรแม่', 
            'หน้าหมา', 'หน้าด้าน', 'อีเอ๋อ', 'อีเหี้ย', 'เหี้ยไร', 'ควยไร', 'ห่า', 'ห่าน', 
            'หำ', 'หอย', 'กระเจี๋ยว', 'กระปู๋', 'จู๋', 'เจี๊ยว', 'หมอย', 'ขนหมอย', 'หัวดอ', 'ปิ๊', 
            'จังไร', 'เปรต', 'ถ่อย', 'สัตว์เดรัจฉาน', 'กาลกิณี', 'สันดาน', 'ชั่วช้า', 'บัดซบ',
            'บักห่า', 'บักควย', 'สู', 'อีฮ่า', 'อีปอบ', 'ปอบ', 'ง่าว', 'งั่ง', 'กาก', 'กระจอก',
            'kuay', 'kwai', 'khuay', 'hiae', 'hia', 'hee', 'heia', 'sadd', 'sat', 'sut', 
            'yed', 'yhed', 'mung', 'gu', 'ku', 'maeng', 'mg', 'aihia', 'aikuay', 'kuy', 'kwy',
            'fuck', 'fucking', 'fucked', 'fucker', 'motherfucker', 'shit', 'bitch', 'asshole', 
            'bastard', 'cunt', 'dick', 'pussy', 'cock', 'slut', 'whore', 'nigger', 'nigga',
            'admin', 'administrator', 'moderator', 'mod', 'root', 'system', 'spechub'
        ];

        function removeThaiDiacritics(text) {
            return text.replace(/[\u0E31\u0E34-\u0E3A\u0E47-\u0E4E]/g, '');
        }

        function normalizeText(text) {
            let str = text.toLowerCase();
            str = removeThaiDiacritics(str);
            str = str.replace(/0/g, 'o')
                     .replace(/1/g, 'i')
                     .replace(/3/g, 'e')
                     .replace(/4/g, 'a')
                     .replace(/5/g, 'ha')
                     .replace(/@/g, 'a')
                     .replace(/\$/g, 's');

            const mapChars = {
                'ต': 'd', 'ท': 'd', 'ธ': 'd', 'ถ': 'd', 'ฐ': 'd', 'ฑ': 'd', 'ฒ': 'd', 'ด': 'd',
                'ย': 'y', 'เ': 'e', 'แ': 'ae', 'โ': 'o', 'ใ': 'ai', 'ไ': 'ai', 'ี': 'i', 'ะ': 'a', 'า': 'a',
                'อ': 'o', 'ุ': 'u', 'ู': 'u', 'ิ': 'i', 'ื': 'u', 'ึ': 'u',
                'ก': 'k', 'ค': 'k', 'ฆ': 'k', 'ข': 'k', 'ส': 's', 'ศ': 's', 'ษ': 's', 'ซ': 's',
                'บ': 'b', 'ป': 'p', 'พ': 'p', 'ภ': 'p', 'ฟ': 'f', 'ฝ': 'f',
                'ม': 'm', 'น': 'n', 'ณ': 'n', 'ร': 'r', 'ล': 'l', 'ฬ': 'l',
                'ว': 'w', 'ห': 'h', 'ฮ': 'h', 'จ': 'j', 'ช': 'ch', 'ฉ': 'ch', 'ฌ': 'ch'
            };

            let normalized = '';
            for (let i = 0; i < str.length; i++) {
                let char = str[i];
                normalized += mapChars[char] !== undefined ? mapChars[char] : char;
            }
            return normalized.replace(/[\s\-_.,!@#$%^&*()+=|\\/~`[\]{}<>?:]+/g, '');
        }

        function containsBadWord(text) {
            const rawText = text.toLowerCase().replace(/[\s\-_.,!@#$%^&*()+=|\\/~`[\]{}<>?:]+/g, '');
            const noDiacriticsText = removeThaiDiacritics(text.toLowerCase()).replace(/[\s\-_.,!@#$%^&*()+=|\\/~`[\]{}<>?:]+/g, '');
            const convertedText = normalizeText(text);

            return BAD_WORDS.some(badWord => {
                const cleanBadWord = badWord.toLowerCase();
                return rawText.includes(cleanBadWord) || 
                       noDiacriticsText.includes(cleanBadWord) || 
                       convertedText.includes(cleanBadWord);
            });
        }

        function saveSignupDraft() {
            const draft = {
                username: usernameInput.value,
                email: emailInput.value
            };
            localStorage.setItem(SIGNUP_DRAFT_KEY, JSON.stringify(draft));
        }

        function loadSignupDraft() {
            const saved = localStorage.getItem(SIGNUP_DRAFT_KEY);
            if (saved) {
                try {
                    const draft = JSON.parse(saved);
                    if (draft.username) usernameInput.value = draft.username;
                    if (draft.email) emailInput.value = draft.email;
                } catch (e) {
                    console.error('Error loading draft', e);
                }
            }
        }

        function clearSignupDraft() {
            localStorage.removeItem(SIGNUP_DRAFT_KEY);
        }

        function showError(message) {
            const errorEl = document.getElementById('signupError');
            if (!errorEl) return;
            errorEl.textContent = message;
            errorEl.style.display = message ? 'block' : 'none';
        }

        function setLoading(isLoading) {
            submitBtn.disabled = isLoading;
            if (isLoading) {
                btnText.innerHTML = '<span class="spinner"></span> <span>กำลังตรวจสอบข้อมูล...</span>';
            } else {
                btnText.textContent = 'สมัครสมาชิก';
            }
        }

        usernameInput.addEventListener('input', saveSignupDraft);
        emailInput.addEventListener('input', saveSignupDraft);
        document.addEventListener('DOMContentLoaded', loadSignupDraft);

        document.getElementById('signupForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            showError('');

            const username = usernameInput.value.trim();
            const email = emailInput.value.trim().toLowerCase();
            const password = passwordInput.value;
            const confirmPassword = confirmPasswordInput.value;

            if (!username || !email || !password || !confirmPassword) {
                showError('กรุณากรอกข้อมูลให้ครบทุกช่อง');
                return;
            }

            if (containsBadWord(username)) {
                showError('❌ ชื่อบัญชีไม่เหมาะสม (ตรวจพบคำหยาบคาย หรือคำสงวน)');
                return;
            }

            if (password.length < 6) {
                showError('รหัสผ่านต้องมีความยาวอย่างน้อย 6 ตัวอักษร');
                return;
            }

            if (password !== confirmPassword) {
                showError('รหัสผ่านและยืนยันรหัสผ่านไม่ตรงกัน');
                return;
            }

            try {
                setLoading(true);

                const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
                const API_URL = isLocal 
                    ? 'http://localhost:5000/api/signup' 
                    : 'https://spec-hub.onrender.com/api/signup';

                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password })
                });

                const data = await response.json();

                if (!response.ok) {
                    showError(data.message || 'เกิดข้อผิดพลาดในการสมัครสมาชิก');
                    setLoading(false);
                    return;
                }

                clearSignupDraft();
                localStorage.setItem('spechub_user', username);
                alert('สมัครสมาชิกเรียบร้อยแล้ว!');
                window.location.href = 'HOME.html';

            } catch (error) {
                console.error(error);
                showError('ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้ โปรดตรวจสอบการเชื่อมต่ออินเทอร์เน็ตหรือสถานะ Backend');
                setLoading(false);
            }
        });
    </script>
</body>
</html>
