<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPEC HUB - Signup</title>
    <!-- เพิ่ม Favicon -->
    <link rel="icon" type="image/png" href="assets/LOGO%20SPECHUB.png">
    <!-- นำเข้า Font 'Inter' เพื่อความทันสมัย -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- นำเข้า Font Awesome สำหรับไอคอน -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --bg-image: url('assets/BK LOGUN.jpg');
            --glass-bg: rgba(15, 23, 42, 0.25);
            --glass-border: rgba(255, 255, 255, 0.18);
            --text-color: #e2e8f0;
            --input-bg: rgba(0, 0, 0, 0.2);
            --input-text: #ffffff;
            --input-placeholder: rgba(255, 255, 255, 0.6);
            --btn-bg: #e2e8f0;
            --btn-text: #0f172a;
            --btn-hover-bg: #ffffff;
            --link-color: #60a5fa;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-image: var(--bg-image);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: var(--text-color);
        }

        /* Dark Overlay บนพื้นหลัง */
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.25);
            z-index: 1;
        }

        /* กล่อง Signup Glassmorphism */
        .box {
            position: relative;
            background: var(--glass-bg);
            padding: 40px;
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.35);
            width: 100%;
            max-width: 420px;
            z-index: 2;
            text-align: center;
            margin: 20px 0;
        }

        h2 {
            margin-bottom: 25px;
            font-weight: 700;
            font-size: 2rem;
            letter-spacing: -0.5px;
            color: #ffffff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        .input-group {
            position: relative;
            margin-bottom: 16px;
            text-align: left;
        }

        .input-group i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--input-placeholder);
            font-size: 1.1rem;
            pointer-events: none;
            transition: color 0.2s ease;
        }

        .input-group input {
            width: 100%;
            padding: 14px 15px 14px 45px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            font-size: 0.95rem;
            color: var(--input-text);
            background: var(--input-bg);
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .input-group input::placeholder {
            color: var(--input-placeholder);
        }

        .input-group input:focus {
            outline: none;
            background: rgba(0, 0, 0, 0.35);
            border-color: rgba(96, 165, 250, 0.6);
        }

        .input-group input:focus + i {
            color: #60a5fa;
        }

        .toggle-password {
            left: auto !important;
            right: 15px !important;
            cursor: pointer !important;
            pointer-events: auto !important;
        }

        button[type="submit"] {
            width: 100%;
            padding: 15px;
            border-radius: 999px;
            border: none;
            background: var(--btn-bg);
            color: var(--btn-text);
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
            margin-top: 10px;
            margin-bottom: 10px;
        }

        button[type="submit"]:hover {
            background: var(--btn-hover-bg);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }

        .note {
            margin-top: 18px;
            font-size: 0.9rem;
            color: #e2e8f0;
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
        }

        .note a {
            color: var(--link-color);
            text-decoration: none;
            font-weight: 600;
        }
        .note a:hover {
            text-decoration: underline;
        }

        .error {
            margin-bottom: 15px;
            color: #f87171;
            font-size: 0.9rem;
            background: rgba(239, 68, 68, 0.25);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(239, 68, 68, 0.4);
            display: none;
        }

        @media (max-width: 480px) {
            .box {
                padding: 30px 20px;
                margin: 20px;
            }
            h2 {
                font-size: 1.75rem;
            }
        }
    </style>
</head>
<body>

    <div class="box">
        <h2>สมัครสมาชิก</h2>
        
        <div class="error" id="signupError"></div>

        <form id="signupForm">
            <!-- Username -->
            <div class="input-group">
                <input id="newUsername" name="newUsername" placeholder="Username (เช่น user123)" autocomplete="off" required>
                <i class="fas fa-user"></i>
            </div>

            <!-- Email -->
            <div class="input-group">
                <input id="newEmail" name="newEmail" type="email" placeholder="Email (example@mail.com)" autocomplete="off" required>
                <i class="fas fa-envelope"></i>
            </div>

            <!-- Password -->
            <div class="input-group">
                <input id="newPassword" name="newPassword" type="password" placeholder="Password" required>
                <i class="fas fa-lock"></i>
                <i class="fas fa-eye-slash toggle-password" id="togglePassword"></i>
            </div>

            <!-- Confirm Password -->
            <div class="input-group">
                <input id="confirmPassword" name="confirmPassword" type="password" placeholder="Confirm Password" required>
                <i class="fas fa-lock"></i>
                <i class="fas fa-eye-slash toggle-password" id="toggleConfirmPassword"></i>
            </div>

            <button type="submit" id="submitBtn">สมัครสมาชิก</button>
        </form>

        <div class="note">มีบัญชีแล้ว? <a href="Login.html">เข้าสู่ระบบ</a></div>
    </div>

    <script>
        // --- เปิด/ปิดการมองเห็นรหัสผ่าน ---
        function setupTogglePassword(toggleId, inputId) {
            const toggleBtn = document.getElementById(toggleId);
            const inputField = document.getElementById(inputId);

            if (toggleBtn && inputField) {
                toggleBtn.addEventListener('click', function () {
                    const type = inputField.getAttribute('type') === 'password' ? 'text' : 'password';
                    inputField.setAttribute('type', type);
                    this.classList.toggle('fa-eye');
                    this.classList.toggle('fa-eye-slash');
                });
            }
        }

        setupTogglePassword('togglePassword', 'newPassword');
        setupTogglePassword('toggleConfirmPassword', 'confirmPassword');

        // --- ระบบ Draft & Form Handler ---
        const SIGNUP_DRAFT_KEY = 'spechub_signup_draft';

        const usernameInput = document.getElementById('newUsername');
        const emailInput = document.getElementById('newEmail');
        const passwordInput = document.getElementById('newPassword');
        const confirmPasswordInput = document.getElementById('confirmPassword');

        // คลังคำหยาบ (ครอบคลุม อวัยวะเพศ/สแลงเด็ก/คำโบราณ/คำถิ่น/คาราโอเกะ/ภาษาอังกฤษ/คำสงวน)
        const BAD_WORDS = [
            // --- คำหยาบภาษาไทยทั่วไป / สรีระ / เพศ ---
            'ควย', 'เหี้ย', 'ส้นตีน', 'เย็ด', 'เชี่ย', 'มึง', 'กู', 'แม่ง', 'สัส', 'สาส', 'สัด', 
            'ไอ้สัตว์', 'ไอ้สัส', 'อีดอก', 'อีเวร', 'ระยำ', 'ชาติหมา', 'เงี่ยน', 'กระหรี่', 'กะหรี่', 
            'โสเภณี', 'หี', 'จิ๋ม', 'แตด', 'ตูด', 'ดอ', 'เย็ดแม่', 'เย็ดแม่ง', 'โคตรพ่อ', 'โคตรแม่', 
            'หน้าหมา', 'หน้าด้าน', 'อีเอ๋อ', 'อีควาย', 'อีเหี้ย', 'เหี้ยไร', 'ควยไร', 'ห่า', 'ห่าน', 
            'ฉี่', 'ขี้', 'ตด', 'อมควย', 'ดูดควย', 'เลียหี', 'เย็ดกัน', 'ชักว่าว', 'เสียน', 'เจ็ดแม่',

            // --- คำสแลงอวัยวะเพศ / เรื่องเพศเพิ่มเติม ---
            'หำ', 'หอย', 'กระเจี๋ยว', 'กระปู๋', 'จู๋', 'เจี๊ยว', 'หมอย', 'ขนหมอย', 
            'หัวดอ', 'ก้น', 'ไข่', 'อวัยวะเพศ', 'ลึงค์', 'ช่องคลอด', 'ปิ๊', 'ปิ๊ปิ๊', 
            'กระจู๋', 'เจี๊ยวจ๊าว', 'หำใหญ่', 'หอยแคลง', 'หอยเชลล์',

            // --- คำหยาบโบราณ / คำด่าโบราณ / คำแช่ง ---
            'จังไร', 'อีจังไร', 'ชาติเปรต', 'เปรต', 'ถ่อย', 'สัตว์เดรัจฉาน', 'อีร้อยเอ็ด', 'อีร้อยลิ้น', 
            'อ้าย', 'อีฉิน', 'อีเหวย', 'กาลกิณี', 'ถุย', 'สันดาน', 'ชั่วช้า', 'บัดซบ', 'ระยำตำบอน',
            'สถุล', 'อัปสร', 'อัปสรา', 'ระยำหมา', 'บัดสี', 'อีปลวก',

            // --- คำหยาบภาษาถิ่น (อีสาน / เหนือ / ใต้) ---
            'บักห่า', 'บักควย', 'สู', 'อีฮ่า', 'อีปอบ', 'ปอบ', 'ห่าขั้ว', 'ห่ากิน', 'ยัดห่า', 
            'บักโคตร', 'ง่าว', 'ควายง่าว', 'งั่ง', 'บักขี้เกี้ยม', 'ห่าแดก', 'ขี้แดก', 'อ้ายขี้ง่าว',
            'หัวควย', 'พ่อมึงตาย', 'แม่มึงตาย', 'ไอ้หน้าลี', 'หลี', 'เย็ดฮี',

            // --- ภาษาไทยคาราโอเกะ / คำสแลงเลี่ยงคำ (Thai Transliterated & Slang) ---
            'kuay', 'kwai', 'khuay', 'hiae', 'hia', 'hee', 'heia', 'sadd', 'sat', 'sut', 'sart', 
            'yed', 'yhed', 'yiet', 'mung', 'gu', 'ku', 'maeng', 'mg', 'aihia', 'aikuay', 'kuy', 'kwy',
            'k.u.a.y', 'h.i.a', 'y.e.d', 'k_u_a_y', 'h_i_a', 'y_e_d', 'เย้ด', 'เคว็ย', 'ค-ว-ย',
            'hum', 'hoi', 'jim', 'joo', 'krajiaw', 'krapu',

            // --- คำหยาบภาษาอังกฤษ (English Profanity) ---
            'fuck', 'fucking', 'fucked', 'fucker', 'motherfucker', 'shit', 'shitty', 'bitch', 'asshole', 
            'bastard', 'cunt', 'dick', 'pussy', 'cock', 'piss', 'slut', 'whore', 'dildo', 'ass', 'nigger', 'nigga',

            // --- คำสงวนของระบบ (System Roles) ---
            'admin', 'administrator', 'moderator', 'mod', 'root', 'system', 'owner', 'spechub', 'support', 'official'
        ];

        // ฟังก์ชันลบวรรณยุกต์และสระภาษาไทยบน/ล่าง (ดักจับการพิมพ์ไม้เอก ไม้โท เพื่อหลบคำ)
        function removeThaiDiacritics(text) {
            return text.replace(/[\u0E31\u0E34-\u0E3A\u0E47-\u0E4E]/g, '');
        }

        function normalizeText(text) {
            let str = text.toLowerCase();
            
            // 1. ลบวรรณยุกต์ไทยออกก่อน
            str = removeThaiDiacritics(str);

            // 2. แปลงตัวเลขหลบคำ (Leetspeak)
            str = str.replace(/0/g, 'o')
                     .replace(/1/g, 'i')
                     .replace(/3/g, 'e')
                     .replace(/4/g, 'a')
                     .replace(/5/g, 'ha')
                     .replace(/@/g, 'a')
                     .replace(/\$/g, 's');

            // 3. แปลงอักษรไทยเป็นอักษรละตินเทียบเคียง
            const mapChars = {
                'ต': 'd', 'ท': 'd', 'ธ': 'd', 'ถ': 'd', 'ฐ': 'd', 'ฑ': 'd', 'ฒ': 'd', 'ด': 'd',
                'ย': 'y', 'เ': 'e', 'แ': 'ae', 'โ': 'o', 'ใ': 'ai', 'ไ': 'ai', 'ี': 'i', 'ะ': 'a', 'า': 'a',
                'อ': 'o', 'ุ': 'u', 'ู': 'u', 'ิ': 'i', 'ื': 'u', 'ึ': 'u',
                'ก': 'k', 'ค': 'k', 'ฆ': 'k', 'ข': 'k', 'ส': 's', 'ศ': 's', 'ษ': 's', 'ซ': 's',
                'บ': 'b', 'ป': 'p', 'พ': 'p', 'ภ': 'p', 'ฟ': 'f', 'ฝ': 'f',
                'ม': 'm', 'น': 'n', 'ณ': 'n', 'ร': 'r', 'ล': 'l', 'ฬ': 'l',
                'ว': 'w', 'ห': 'h', 'ฮ': 'h', 'จ': 'j', 'ช': 'ch', 'ฉ': 'ch', 'ฌ': 'ch'
            };

            let normalized = '';
            for (let i = 0; i < str.length; i++) {
                let char = str[i];
                normalized += mapChars[char] !== undefined ? mapChars[char] : char;
            }
            
            // ลบเว้นวรรคและอักขระพิเศษออกทั้งหมด
            return normalized.replace(/[\s\-_.,!@#$%^&*()+=|\\/~`[\]{}<>?:]+/g, '');
        }

        function containsBadWord(text) {
            // ข้อความดั้งเดิมที่ลบสัญลักษณ์
            const rawText = text.toLowerCase().replace(/[\s\-_.,!@#$%^&*()+=|\\/~`[\]{}<>?:]+/g, '');
            // ข้อความแบบลบวรรณยุกต์ไทย
            const noDiacriticsText = removeThaiDiacritics(text.toLowerCase()).replace(/[\s\-_.,!@#$%^&*()+=|\\/~`[\]{}<>?:]+/g, '');
            // ข้อความแปลงสแลง/คาราโอเกะ
            const convertedText = normalizeText(text);

            return BAD_WORDS.some(badWord => {
                const cleanBadWord = badWord.toLowerCase();
                return rawText.includes(cleanBadWord) || 
                       noDiacriticsText.includes(cleanBadWord) || 
                       convertedText.includes(cleanBadWord);
            });
        }

        function saveSignupDraft() {
            const draft = {
                username: usernameInput.value,
                email: emailInput.value,
                password: passwordInput.value,
                confirmPassword: confirmPasswordInput.value
            };
            localStorage.setItem(SIGNUP_DRAFT_KEY, JSON.stringify(draft));
        }

        function loadSignupDraft() {
            const saved = localStorage.getItem(SIGNUP_DRAFT_KEY);
            if (saved) {
                try {
                    const draft = JSON.parse(saved);
                    if (draft.username !== undefined) usernameInput.value = draft.username;
                    if (draft.email !== undefined) emailInput.value = draft.email;
                    if (draft.password !== undefined) passwordInput.value = draft.password;
                    if (draft.confirmPassword !== undefined) confirmPasswordInput.value = draft.confirmPassword;
                } catch (e) {
                    console.error('Error loading signup draft', e);
                }
            }
        }

        function clearSignupDraft() {
            localStorage.removeItem(SIGNUP_DRAFT_KEY);
        }

        function showError(message) {
            const errorEl = document.getElementById('signupError');
            if (!errorEl) return;
            errorEl.textContent = message;
            errorEl.style.display = message ? 'block' : 'none';
        }

        usernameInput.addEventListener('input', saveSignupDraft);
        emailInput.addEventListener('input', saveSignupDraft);
        passwordInput.addEventListener('input', saveSignupDraft);
        confirmPasswordInput.addEventListener('input', saveSignupDraft);

        document.addEventListener('DOMContentLoaded', loadSignupDraft);

        document.getElementById('signupForm').addEventListener('submit', async function(e){
            e.preventDefault();
            showError('');
            
            const submitBtn = document.getElementById('submitBtn');
            const username = usernameInput.value.trim();
            const email = emailInput.value.trim().toLowerCase();
            const password = passwordInput.value;
            const confirmPassword = confirmPasswordInput.value;

            if (containsBadWord(username)) {
                showError('ไม่อนุญาตให้ใช้ Username ที่มีคำหยาบคายหรือไม่เหมาะสม');
                return;
            }

            if (password !== confirmPassword) {
                showError('รหัสผ่านและยืนยันรหัสผ่านต้องเหมือนกัน');
                return;
            }
            if (password.length < 6) {
                showError('รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร');
                return;
            }

            try {
                submitBtn.disabled = true;
                submitBtn.innerText = 'กำลังส่งข้อมูล...';

                const response = await fetch('https://spec-hub.onrender.com/api/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password })
                });

                const data = await response.json();

                if (!response.ok) {
                    showError(data.message || 'เกิดข้อผิดพลาดในการสมัครสมาชิก (Error ' + response.status + ')');
                    submitBtn.disabled = false;
                    submitBtn.innerText = 'สมัครสมาชิก';
                    return;
                }

                clearSignupDraft();
                localStorage.setItem('spechub_user', username);
                alert('สมัครสมาชิกเรียบร้อยแล้ว!');
                window.location = 'HOME.html';
            } catch (error) {
                console.error(error);
                showError('ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้ โปรดรอ Render บูตสักครู่แล้วลองใหม่');
                submitBtn.disabled = false;
                submitBtn.innerText = 'สมัครสมาชิก';
            }
        });
    </script>
</body>
</html>
